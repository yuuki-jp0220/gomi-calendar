name: Check official garbage calendar sources

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-garbage-source-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official sources
        run: python scripts/check_official_sources.py
      - name: Commit source status when changed
        run: |
          if [[ -n "$(git status --porcelain data/source-status.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/source-status.json
            git commit -m "Refresh official garbage source status"
            git push
          fi
