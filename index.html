<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b55"><title>ごみ出しカレンダー</title><style>
:root{font-family:system-ui,"Noto Sans JP",sans-serif;color:#18332c;background:#f3f7f5}*{box-sizing:border-box}body{margin:0}header{background:#176b55;color:white;padding:22px max(16px,calc((100% - 850px)/2))}main{max-width:850px;margin:18px auto;padding:0 14px}.card{background:white;border:1px solid #dce8e2;border-radius:16px;padding:16px;margin:12px 0}button{border:0;border-radius:10px;background:#176b55;color:white;padding:10px 14px;font:inherit;cursor:pointer}button.alt{background:#e7f3ed;color:#176b55}input,select{padding:10px;border:1px solid #cbdad2;border-radius:9px;font:inherit;max-width:100%}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{background:#f7faf8;border:1px solid #dce8e2;border-radius:9px;min-height:70px;padding:6px 2px;text-align:center;font-size:13px}.day.today{outline:2px solid #176b55}.tag{display:block;color:#176b55;font-size:11px;overflow-wrap:anywhere}.muted{color:#71847c;font-size:13px}.tab{background:#e7f3ed;color:#176b55}.tab.on{background:#176b55;color:white}.hidden{display:none}label{font-size:13px;margin:5px;display:inline-block}.item{display:flex;justify-content:space-between;border-bottom:1px solid #e3ece7;padding:9px 0;gap:8px}</style>
<header><small>DAILY LIFE / WASTE MANAGEMENT</small><h1>ごみ出しカレンダー</h1><div id="today"></div></header><main><nav class="row"><button class="tab on" data-tab="cal">カレンダー</button><button class="tab" data-tab="rules">収集ルール</button><button class="tab" data-tab="settings">設定・データ</button></nav>
<section id="cal"><div class="card"><div class="row" style="justify-content:space-between"><button class="alt" id="prev">‹ 前月</button><b id="month"></b><button class="alt" id="next">翌月 ›</button></div><div class="grid" id="calendar" style="margin-top:12px"></div></div><div class="card"><b id="picked"></b><div id="pickedList" class="muted"></div><hr><b>今後7日間</b><div id="upcoming"></div></div></section>
<section id="rules" class="hidden"><div class="card"><h3>毎週の収集ルール</h3><label>種類 <input id="kind" placeholder="燃えるごみ"></label><div>曜日：<br><label><input type="checkbox" class="wd" value="0">日</label><label><input type="checkbox" class="wd" value="1">月</label><label><input type="checkbox" class="wd" value="2">火</label><label><input type="checkbox" class="wd" value="3">水</label><label><input type="checkbox" class="wd" value="4">木</label><label><input type="checkbox" class="wd" value="5">金</label><label><input type="checkbox" class="wd" value="6">土</label></div><label>繰り返し <select id="repeat"><option value="weekly">毎週</option><option value="first">第1週</option><option value="second">第2週</option><option value="third">第3週</option><option value="fourth">第4週</option><option value="fifth">第5週</option><option value="last">最終週</option></select></label><label>メモ <input id="memo" placeholder="朝8時まで"></label><button id="add">ルールを追加</button><div id="rulesList"></div></div><div class="card"><h3>臨時予定</h3><label>日付 <input type="date" id="extraDate"></label><label>種類 <input id="extraKind" placeholder="資源ごみ"></label><button id="addExtra">追加</button><div id="extras"></div></div></section>
<section id="settings" class="hidden"><div class="card"><h3>通知設定</h3><label><input type="checkbox" id="notify"> 前日に通知する</label><label>通知時刻 <input type="time" id="notifyTime" value="19:00"></label><button id="allow" class="alt">通知を許可</button><p class="muted">ページを開いている間に通知を確認します。閉じている間の通知は保証されません。自治体の祝日・年末年始の変更は臨時予定で調整してください。</p><div id="status" class="muted"></div></div><div class="card"><h3>データ管理</h3><button id="export" class="alt">書き出し</button><label>読み込み <input type="file" id="import" accept="application/json"></label><button id="reset" style="background:#b33d36">全消去</button><p class="muted">データはこのブラウザ内に保存されます。端末間同期はありません。</p></div></section></main>
<script>
const $=x=>document.getElementById(x),D=["日","月","火","水","木","金","土"];let db=JSON.parse(localStorage.gomiData||'{"rules":[],"extras":[]}'),v=new Date(),sel=new Date();sel.setHours(0,0,0,0);$("today").textContent=new Date().toLocaleDateString("ja-JP",{dateStyle:"full"});
function list(y,m){let a=[];db.rules.forEach(r=>{for(let d=1;d<=new Date(y,m+1,0).getDate();d++){let x=new Date(y,m,d),w=Math.ceil(d/7),last=d+7>new Date(y,m+1,0).getDate();if(r.days.includes(x.getDay())&&(r.rep==="weekly"||r.rep==="last"&&last||r.rep!=="last"&&r.rep!=="weekly"&&Number(r.rep)===w))a.push({date:x,kind:r.kind,memo:r.memo,id:r.id})}});db.extras.forEach(e=>{let x=new Date(e.date+"T00:00:00");if(x.getFullYear()===y&&x.getMonth()===m)a.push({...e,date:x,extra:true})});return a.sort((a,b)=>a.date-b.date)}
const same=(a,b)=>a.toDateString()===b.toDateString(),save=()=>localStorage.gomiData=JSON.stringify(db);
function chosen(){let a=list(sel.getFullYear(),sel.getMonth()).filter(x=>same(x.date,sel));$("picked").textContent=sel.toLocaleDateString("ja-JP",{dateStyle:"full"});$("pickedList").innerHTML=a.length?a.map(x=>"<div class=item>"+x.kind+" <span>"+(x.memo||"")+"</span></div>").join(""):"予定なし"}
function draw(){let y=v.getFullYear(),m=v.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());$("month").textContent=y+"年 "+(m+1)+"月";let h=D.map(x=>'<div class=muted style="text-align:center">'+x+"</div>").join("");for(let i=0;i<42;i++){let x=new Date(start);x.setDate(start.getDate()+i);let a=list(y,m).filter(q=>same(q.date,x));h+='<div class="day '+(same(x,new Date())?"today":"")+'" data-date="'+[x.getFullYear(),String(x.getMonth()+1).padStart(2,"0"),String(x.getDate()).padStart(2,"0")).join("-")+'"><b>'+x.getDate()+"</b>"+a.map(q=>'<span class=tag>'+q.kind+"</span>").join("")+"</div>"}$("calendar").innerHTML=h;$("calendar").querySelectorAll(".day").forEach(e=>e.onclick=()=>{sel=new Date(e.dataset.date+"T00:00:00");chosen()});chosen();let up=[];for(let i=0;i<7;i++){let x=new Date();x.setDate(x.getDate()+i);up.push(...list(x.getFullYear(),x.getMonth()).filter(q=>same(q.date,x)))}$("upcoming").innerHTML=up.length?up.map(x=>'<div class=item>'+x.date.toLocaleDateString("ja-JP",{month:"numeric",day:"numeric",weekday:"short"})+"　<b>"+x.kind+"</b></div>").join(""):"予定なし"}
function manage(){$("rulesList").innerHTML=db.rules.map(r=>'<div class=item><span>'+r.kind+" / "+r.days.map(x=>D[x]).join("・")+" / "+(r.rep==="weekly"?"毎週":r.rep==="last"?"最終週":"第"+r.rep+"週")+'</span><button onclick="delRule(\''+r.id+'\')">削除</button></div>').join("")||"登録なし";$("extras").innerHTML=db.extras.map(e=>'<div class=item>'+e.date+" "+e.kind+' <button onclick="delExtra(\''+e.id+'\')">削除</button></div>').join("")}
window.delRule=id=>{db.rules=db.rules.filter(x=>x.id!==id);save();manage();draw()};window.delExtra=id=>{db.extras=db.extras.filter(x=>x.id!==id);save();manage();draw()};
$("add").onclick=()=>{let kind=$("kind").value.trim(),days=[...document.querySelectorAll(".wd:checked")].map(x=>+x.value);if(!kind||!days.length)return alert("種類と曜日を選んでください");db.rules.push({id:crypto.randomUUID(),kind,days,rep:$("repeat").value,memo:$("memo").value});save();$("kind").value="";document.querySelectorAll(".wd").forEach(x=>x.checked=false);manage();draw()};
$("addExtra").onclick=()=>{if(!$("extraDate").value||!$("extraKind").value.trim())return alert("日付と種類を入力してください");db.extras.push({id:crypto.randomUUID(),date:$("extraDate").value,kind:$("extraKind").value});save();manage();draw()};
$("prev").onclick=()=>{v.setMonth(v.getMonth()-1);draw()};$("next").onclick=()=>{v.setMonth(v.getMonth()+1);draw()};document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));["cal","rules","settings"].forEach(x=>$(x).classList.toggle("hidden",x!==b.dataset.tab))});
$("notify").checked=localStorage.gomiNotify==="1";$("notifyTime").value=localStorage.gomiNotifyTime||"19:00";$("notify").onchange=e=>localStorage.gomiNotify=e.target.checked?"1":"0";$("notifyTime").onchange=e=>localStorage.gomiNotifyTime=e.target.value;$("allow").onclick=async()=>{if(!("Notification"in window))return alert("通知非対応です");$("status").textContent="通知："+await Notification.requestPermission()};
let sent="";setInterval(()=>{if(!$("notify").checked||Notification.permission!=="granted")return;let n=new Date();if(n.getHours()+":"+String(n.getMinutes()).padStart(2,"0")!==$("notifyTime").value)return;let t=new Date();t.setDate(t.getDate()+1);let a=list(t.getFullYear(),t.getMonth()).filter(x=>same(x.date,t));if(a.length&&sent!==t.toDateString()){new Notification("明日のごみ出し",{body:a.map(x=>x.kind).join("・")});sent=t.toDateString()}},30000);
$("export").onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.href=u;a.download="gomi-data.json";a.click();URL.revokeObjectURL(u)};
$("import").onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.rules)||!Array.isArray(x.extras))throw 0;db=x;save();manage();draw()}catch{alert("読み込み失敗")}};
$("reset").onclick=()=>{if(confirm("すべて削除しますか？")){db={rules:[],extras:[]};save();manage();draw()}};manage();draw();
</script></html>
